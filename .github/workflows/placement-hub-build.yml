name: Placement Hub build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/placement-hub-ux

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and type-check
        run: npm run build
